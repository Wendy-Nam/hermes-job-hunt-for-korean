<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{{applicant_name}} - 맞춤 자기소개서 ({{target_company}} {{target_position}})</title>
  <style>
    :root { --ink:#202833; --accent:#234e70; --muted:#66717e; }
    * { box-sizing:border-box; }
    @page { size:A4; margin:18mm 20mm; }
    body { font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif; color:var(--ink); line-height:1.72; margin:0; font-size:10.3pt; }
    header { border-bottom:1.5px solid var(--accent); padding-bottom:4mm; margin-bottom:8mm; }
    h1 { font-size:19pt; color:var(--ink); margin:0 0 2mm; }
    .sub-title { font-size:9pt; color:var(--muted); font-weight:500; }
    .section-block { margin-bottom:8mm; }
    .section-title { font-size:11pt; font-weight:700; color:var(--accent); margin-bottom:3mm; padding-bottom:1.5mm; border-bottom:1px solid #d8dee5; }
    .section-body { text-align:justify; white-space:pre-line; line-height:1.85; }
  </style>
</head>
<body>

  <header>
    <h1>자기소개서 / Cover Letter</h1>
    <div class="sub-title">지원자: {{applicant_name}} | 지원 회사: {{target_company}} | 지원 직무: {{target_position}}</div>
  </header>

  <div class="section-block">
    <div class="section-title">1. 지원 동기 및 포지션 적합성 (Motivation &amp; Fit Alignment)</div>
    <div class="section-body">{{motivation_text}}</div>
  </div>

  <div class="section-block">
    <div class="section-title">2. 주요 직무 성과 및 문제 해결 사례 (Key Achievements)</div>
    <div class="section-body">{{achievements_text}}</div>
  </div>

  <div class="section-block">
    <div class="section-title">3. 입사 후 기여 계획 (Future Contribution)</div>
    <div class="section-body">{{future_plan_text}}</div>
  </div>

</body>
</html>
