model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
fallback_providers:
  - provider: openai-codex
    model: gpt-5.6-terra   # 중간 티어. 구독에 5.6이 안 열렸으면 gpt-5.5
agent:
  service_tier: fast
compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.15
tts:
  provider: edge
  edge:
    voice: ko-KR-HyunsuMultilingualNeural
    speed: 1.3
stt:
  enabled: true
  provider: groq
memory:
  memory_enabled: false
  user_profile_enabled: false
delegation:
  model: gpt-5.6-sol   # 실작업은 플래그십(난이도별 티어: sol>terra>luna). 미개방 구독은 gpt-5.5
  provider: openai-codex
skills:
