<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Letter · {{NAME}}</title>
<style>
  @page {
    size: A4;
    margin: 30mm 25mm 25mm 25mm;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", "Helvetica Neue", Arial, "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 10.5pt;
    line-height: 1.6;
    color: #1a1a1a;
    width: 100%;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .page {
    width: 160mm;
  }
  @media screen {
    html { background: #eceef1; }
    body { max-width: 210mm; margin: 24px auto; padding: 30mm 25mm 25mm; background: #fff; }
    .page { width: auto; }
  }
  @media screen and (max-width: 640px) {
    body { margin: 0; padding: 20px 16px; }
  }

  /* Full-width top border band */
  .top-band {
    width: 100%;
    height: 2px;
    background: #1a1a1a;
    margin-bottom: 24pt;
  }

  /* Sender block — two-column style */
  .sender-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 22pt;
  }
  .sender-row .name {
    font-size: 13pt;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .sender-row .contact {
    text-align: right;
    font-size: 9pt;
    color: #555;
    line-height: 1.5;
  }

  /* Date + recipient block */
  .info-block {
    margin-bottom: 20pt;
    line-height: 1.5;
  }
  .info-block .date {
    font-size: 9.5pt;
    color: #444;
    margin-bottom: 14pt;
  }
  .info-block .company {
    font-weight: 600;
    font-size: 11pt;
  }
  .info-block .position {
    font-size: 10pt;
    color: #444;
    margin-top: 0.5pt;
  }

  /* Section spacer */
  .divider {
    width: 100%;
    height: 0.5px;
    background: #d0d0d0;
    margin: 18pt 0;
  }

  /* Body */
  .body p {
    margin-bottom: 9pt;
  }
  .body ul {
    list-style: none;
    margin: 4pt 0 8pt 0;
    padding: 0;
  }
  .body li {
    margin-bottom: 4pt;
    padding-left: 16pt;
    position: relative;
  }
  .body li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.8em;
    width: 6pt;
    height: 1px;
    background: #888;
  }
  .body li strong {
    font-weight: 600;
  }

  /* Closing */
  .closing {
    margin-top: 14pt;
  }
  .closing p {
    margin-bottom: 2pt;
  }
  .closing .regards {
    margin-top: 14pt;
  }

  /* Signature */
  .signature {
    margin-top: 18pt;
  }
  .signature .name {
    font-weight: 700;
    font-size: 11pt;
  }
  .signature .contact {
    font-size: 9pt;
    color: #555;
    margin-top: 1pt;
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-band"></div>

  <div class="sender-row">
    <div class="name">{{NAME}}</div>
    <div class="contact">{{CONTACT}}</div>
  </div>

  <div class="info-block">
    <div class="date">{{DATE}}</div>
    <div class="company">{{COMPANY}}</div>
    <div class="position">{{POSITION}}</div>
  </div>

  <div class="divider"></div>

  <div class="body">
    {{BODY}}
  </div>

  <div class="closing">
    <p>{{CLOSING_LINE}}</p>
    <p class="regards">{{REGARDS}}</p>
  </div>

  <div class="signature">
    <div class="name">{{SIGN_NAME}}</div>
    <div class="contact">{{SIGN_CONTACT}}</div>
  </div>
</div>
</body>
</html>
